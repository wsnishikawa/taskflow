<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div id="app">
        <!-- LOGIN VIEW -->
        <main id="view-login" class="view active">
            <div class="login-container glass-panel">
                <div class="brand">
                    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <h1>Task Flow</h1>
                </div>
                <p class="subtitle">Gerencie suas tarefas com elegância.</p>
                
                <div id="login-error" class="error-msg hidden"></div>

                <form id="login-form">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required placeholder="seu@email.com">
                    </div>
                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary w-full" id="btn-login">Entrar</button>
                </form>
                <div class="form-footer">
                    Não tem uma conta? <a href="#" id="go-to-register">Registre-se</a>
                </div>
            </div>
        </main>

        <!-- REGISTER VIEW -->
        <main id="view-register" class="view hidden">
            <div class="login-container glass-panel">
                <div class="brand">
                    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                    </svg>
                    <h1>Criar Conta</h1>
                </div>

                <div id="register-error" class="error-msg hidden"></div>

                <form id="register-form">
                    <div class="input-group">
                        <label for="reg-name">Nome</label>
                        <input type="text" id="reg-name" required placeholder="Seu Nome">
                    </div>
                    <div class="input-group">
                        <label for="reg-email">E-mail</label>
                        <input type="email" id="reg-email" required placeholder="seu@email.com">
                    </div>
                    <div class="input-group">
                        <label for="reg-password">Senha</label>
                        <input type="password" id="reg-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary w-full" id="btn-register">Registrar</button>
                </form>
                <div class="form-footer">
                    Já tem conta? <a href="#" id="go-to-login">Fazer login</a>
                </div>
            </div>
        </main>

        <!-- DASHBOARD VIEW -->
        <main id="view-dashboard" class="view hidden">
            <nav class="top-nav glass-panel">
                <div class="nav-brand">
                    <svg class="brand-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Task Flow</span>
                </div>
                <div class="nav-user">
                    <span id="user-greeting">Olá</span>
                    <button id="btn-logout" class="btn btn-ghost btn-sm">Sair</button>
                </div>
            </nav>

            <div class="dashboard-content max-w-7xl">
                <!-- Header / Metrics -->
                <header class="dash-header">
                    <h2>Visão Geral</h2>
                    <div class="metrics-grid">
                        <div class="metric-card glass-panel">
                            <span class="metric-title">Total</span>
                            <span class="metric-value" id="metric-total">0</span>
                        </div>
                        <div class="metric-card glass-panel">
                            <span class="metric-title">Concluídas (Hoje)</span>
                            <span class="metric-value text-emerald" id="metric-done">0</span>
                        </div>
                        <div class="metric-card glass-panel">
                            <span class="metric-title">Atrasadas</span>
                            <span class="metric-value text-rose" id="metric-late">0</span>
                        </div>
                    </div>
                </header>

                <div class="main-grid">
                    <!-- Task form -->
                    <section class="task-form-section glass-panel sticky">
                        <h3>Nova Tarefa</h3>
                        <div id="task-msg" class="msg hidden"></div>
                        <form id="new-task-form">
                            <div class="input-group">
                                <label for="task-title">Título</label>
                                <input type="text" id="task-title" required placeholder="O que precisa ser feito?">
                            </div>
                            <div class="input-group">
                                <label for="task-desc">Descrição</label>
                                <textarea id="task-desc" rows="3" placeholder="Detalhes (opcional)"></textarea>
                            </div>
                            <div class="form-row">
                                <div class="input-group">
                                    <label for="task-deadline">Prazo</label>
                                    <input type="date" id="task-deadline">
                                </div>
                                <div class="input-group">
                                    <label for="task-priority">Prioridade</label>
                                    <select id="task-priority">
                                        <option value="baixa">Baixa</option>
                                        <option value="média" selected>Média</option>
                                        <option value="alta">Alta</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-full" id="btn-add-task">Adicionar Tarefa</button>
                        </form>
                    </section>

                    <!-- Task list -->
                    <section class="task-list-section">
                        <div class="list-header">
                            <h3>Minhas Tarefas</h3>
                            <div class="filter-group">
                                <button class="btn-filter active" data-filter="all">Todas</button>
                                <button class="btn-filter" data-filter="pendente">Pendentes</button>
                                <button class="btn-filter" data-filter="concluída">Concluídas</button>
                            </div>
                        </div>
                        <div class="tasks-container" id="tasks-container">
                            <div class="empty-state">
                                <p>Carregando...</p>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
